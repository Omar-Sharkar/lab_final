<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Restaurant Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <div id="app-container" class="d-flex flex-column min-vh-100">
    <!-- Dynamic Header / Navbar -->
    <header id="header-container"></header>

    <!-- Main Content Area -->
    <div class="container-fluid flex-grow-1 p-0 d-flex">
      <!-- Dynamic Sidebar for Admin / Kitchen -->
      <aside id="sidebar-container" class="bg-dark text-white p-3 d-none" style="width: 260px; min-height: calc(100vh - 60px);"></aside>

      <!-- Main Page Content -->
      <main id="main-content" class="flex-grow-1 p-4 overflow-auto" style="height: calc(100vh - 60px);"></main>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;" id="toast-container"></div>

  <!-- Dynamic Modal Container -->
  <div id="modal-container"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Web API Bridge -->
  <script src="js/api.js"></script>

  <!-- Renderer Utilities & Layout Components -->
  <script src="js/utils.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/sidebar.js"></script>

  <!-- Auth & Shared Pages -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/register.js"></script>
  <script src="js/pages/profile.js"></script>

  <!-- Customer Pages -->
  <script src="js/pages/customer/customerDashboard.js"></script>
  <script src="js/pages/customer/menu.js"></script>
  <script src="js/pages/customer/cart.js"></script>
  <script src="js/pages/customer/orderTracking.js"></script>
  <script src="js/pages/customer/orderHistory.js"></script>
  <script src="js/pages/customer/bills.js"></script>
  <script src="js/pages/customer/reviews.js"></script>
  <script src="js/pages/customer/chatbot.js"></script>
  <script src="js/pages/customer/recommendations.js"></script>

  <!-- Admin Pages -->
  <script src="js/pages/admin/dashboard.js"></script>
  <script src="js/pages/admin/foods.js"></script>
  <script src="js/pages/admin/categories.js"></script>
  <script src="js/pages/admin/tables.js"></script>
  <script src="js/pages/admin/orders.js"></script>
  <script src="js/pages/admin/customers.js"></script>
  <script src="js/pages/admin/inventory.js"></script>
  <script src="js/pages/admin/billing.js"></script>
  <script src="js/pages/admin/aiDashboard.js"></script>
  <script src="js/pages/admin/reviewManagement.js"></script>

  <!-- Kitchen Pages -->
  <script src="js/pages/kitchen/dashboard.js"></script>

  <!-- Router Orchestrator -->
  <script src="js/app.js"></script>
</body>
</html>
